ь экзамен</button></div>`}if(page==='review'){h=header('Error vault','RETRIEVAL PRACTICE')+`<p>Повтори ошибку на новых данных, а не запоминай ответ.</p>${store.log.length?'':'<div class="card">Ошибок пока нет.</div>'}${store.log.map(({t,v},j)=>`<div class="card"><b>${names[t.i]}</b><p>${esc(t.q)}</p><p class="bad">Твой ответ: ${esc(v.join(', '))}</p><p class="ok">Правильно: ${esc(t.ans.join(', '))}</p><button onclick="start(${t.i})">Новая задача</button> <button onclick="store.log.splice(${j},1);save();render()">Убрать из журнала</button></div>`).join('')}`}if(page==='legacy')h=header('ADS archive','MIDTERM / LABS / THEORY')+'<iframe id="legacyframe"></iframe>'; $('app').innerHTML=h;if(page==='legacy')$('legacyframe').src='data:text/html;base64,PCFET0NUWVBFIGh0bWw+CjxodG1sIGxhbmc9InJ1Ij48aGVhZD48bWV0YSBjaGFyc2V0PSJVVEYtOCI+PG1ldGEgbmFtZT0idmlld3BvcnQiIGNvbnRlbnQ9IndpZHRoPWRldmljZS13aWR0aCxpbml0aWFsLXNjYWxlPTEiPjx0aXRsZT5BRFMgLy8gRklOQUwgQk9TUyDigJQgS0JUVTwvdGl0bGU+CjxzdHlsZT4KOnJvb3R7LS1iZzojMGIxMDIwOy0tcGFuZWw6IzE1MWQzMDstLXBhbmVsMjojMWMyODQwOy0tbGluZTojMmIzOTU0Oy0tdHh0OiNmMGY1ZmY7LS1tdXRlZDojYThiNmQwOy0tYWNjZW50OiM4YjlkZmY7LS1nb29kOiM0ZWQ3YWE7LS1iYWQ6I2ZmODI5Nn0KKntib3gtc2l6aW5nOmJvcmRlci1ib3h9Ym9keXttYXJnaW46MDtiYWNrZ3JvdW5kOnZhcigtLWJnKTtjb2xvcjp2YXIoLS10eHQpO2ZvbnQ6MTVweC8xLjYgc3lzdGVtLXVpLC1hcHBsZS1zeXN0ZW0sU2Vnb2UgVUksc2Fucy1zZXJpZn1idXR0b24saW5wdXQsdGV4dGFyZWEsc2VsZWN0e2ZvbnQ6aW5oZXJpdH1idXR0b257Y3Vyc29yOnBvaW50ZXJ9LnNoZWxse21heC13aWR0aDoxMTYwcHg7bWFyZ2luOmF1dG87cGFkZGluZzoyNnB4IDE4cHggODBweH0udG9we2Rpc3BsYXk6ZmxleDtqdXN0aWZ5LWNvbnRlbnQ6c3BhY2UtYmV0d2VlbjtnYXA6MjBweDthbGlnbi1pdGVtczpjZW50ZXI7ZmxleC13cmFwOndyYXB9LmV5ZWJyb3d7Y29sb3I6dmFyKC0tYWNjZW50KTtsZXR0ZXItc3BhY2luZzouMTRlbTt0ZXh0LXRyYW5zZm9ybTp1cHBlcmNhc2U7Zm9udC1zaXplOjEycHg7Zm9udC13ZWlnaHQ6ODAwfWgxe2ZvbnQtc2l6ZTpjbGFtcCgzMHB4LDV2dyw0OHB4KTttYXJnaW46NXB4IDAgMDtsZXR0ZXItc3BhY2luZzotLjA1ZW19aDJ7bWFyZ2luOjAgMCAxMHB4O2ZvbnQtc2l6ZToyNXB4fWgze21hcmdpbjowIDAgOHB4O2ZvbnQtc2l6ZToxOHB4fS5tdXRlZHtjb2xvcjp2YXIoLS1td function question(t,isExam){let v=isExam?exam.v[idx]:values;return `<div class="card"><div class="tag">${t.i+1} / ${names[t.i]}</div><h2>${esc(t.q)}</h2>${t.a?graph(t.a,t.d)+`<pre>${t.a.map((x,j)=>j+': '+(x.join(' ')||'—')).join('\n')}</pre>`:''}<div class="row">${t.labels.map((l,j)=>`<label class="field">${esc(l)}<input autocomplete="off" value="${esc(v[j]??'')}" oninput="update(${j},this.value)"></label>`).join('')}</div>${isExam?'':`<div class="row" style="margin-top:20px"><button class="primary" onclick="check()">Проверить</button><button onclick="$('hint').hidden=false">Подсказка</button><button onclick="start(${t.i})">Другие данные</button><button onclick="current=null;values=[];render()">Следующий навык</button></div><p id="hint" hidden>${tips[t.i]}</p><div id="feedback"></div>`}</div>`}function update(j,v){if(exam){exam.v[idx][j]=v;store.exam=exam;save()}else values[j]=v}function start(i){current=task(i);values=[];go('drill')}function check(){let v=current.ans.map((_,j)=>values[j]??'');if($('feedback').innerHTML)return;let ok=record(current,v);$('feedback').innerHTML=`<h2 class="${ok?'ok':'bad'}">${ok?'Correct! ⚡':'Разберём ошибку'}</h2><p>${current.labels.map((l,j)=>`${esc(l)}: <b class="${norm(v[j])===norm(current.ans[j])?'ok':'bad'}">${esc(current.ans[j])}</b>`).join(' · ')}</p><pre>${esc(current.detail)}</pre><p>${tips[current.i]}</p>`}function begin(m,min){exam={tasks:names.map((_,i)=>task(i,m)),v:[],end:min?Date.now()+min*60000:0};exam.v=exam.tasks.map(t=>t.ans.map(()=>''));idx=0;store.exam=exam;save();clearInterval(timer);timer=setInterval(tick,1000);render()}function jump(j){idx=j;render()}function tick(){if(!exam)return;let c=$('clock');if(!c)return;let s=exam.end?Math.max(0,Math.ceil((exam.end-Date.now())/1000)):0;c.textContent=exam.end?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'Untimed';if(exam.end&&s===0)finish(true)}function finish(auto=false){if(!auto&&!confirm('Сдать? Ответы будут открыты.'))return;clearInterval(timer);let E=exam;exam=null;delete store.exam;let score=0;let report=E.tasks.map((t,j)=>{let v=E.v[j],ok=record(t,v);score+=+ok;return `<div class="card"><h3 class="${ok?'ok':'bad'}">${j+1}. ${names[j]} · ${+ok}/1</h3><p>${esc(t.q)}</p><p>Твой ответ: ${esc(v.join(', '))}</p><p>Правильно: ${esc(t.ans.join(', '))}</p><pre>${esc(t.detail)}</pre></div>`}).join('');save();$('app').innerHTML=header(`${score}/18`,'EXAM REPORT')+`<p>Баллы начисляются только за полностью верное задание.</p><button onclick="go('review')">Работа над ошибками</button>`+report}if(store.exam){exam=store.exam;page='mock';timer=setInterval(tick,1000)}render();

const deepLessons=[["Хеш превращает строку в число, чтобы быстрее сравнивать строки.", "ASCII — числовой код буквы; индекс — позиция с нуля; основание — число 29; mod — остаток от деления.", "Для ab: a стоит на индексе 0, b на 1.\n97×1=97\n98×29=2842\n97+2842=2939.", "Представь, что каждая буква кладёт монеты в копилку. Чем дальше буква, тем больше множитель.", "Какой вклад даёт b на индексе 1?", "2842", "98×29=2842."], ["Префиксный хеш позволяет быстро вычислять хеш участка строки без повторного суммирования.", "Префикс — начало строки. H[i] — сумма вкладов от индекса 0 до i включительно.", "abc: H[0]=97.\nH[1]=97+98×29=2939.\nH[2]=2939+99×841=86198.\nЧтобы оставить bc, вычти H[0]: 86198−97=86101.", "Как накопительный счёт в магазине: разность двух итогов даёт стоимость покупок между ними.", "Какой вклад останется, если из H[1] вычесть H[0]?", "2842", "Остаётся только вклад b."], ["Rabin–Karp ищет маленькую строку внутри большой, сравнивая числовые отпечатки участков.", "Text — где ищем. Pattern — что ищем. Окно — участок длины pattern. Индекс окна — позиция его первой буквы, начиная с нуля.", "Text=abc, pattern=bc.\nОкно 0: ab; окно 1: bc.\nhash(bc)=98×1+99×29=2969.\nВ тексте bc занимает индексы 1,2: 98×29+99×841=86101.\n2969×29=86101. Степени совпали!\nДля окна i умножаем hash(pattern) на 29^i (и берём mod, если задан).", "Представь прозрачную линейку с буквами bc. Сдвигая её на одну клетку вправо, увеличиваем каждую степень на 1. Это то же самое, что умножить всю сумму на 29.", "Окно de в abcdef начинается с какого индекса?", "3", "a=0,b=1,c=2,d=3. Значит множитель 29³."], ["Разные данные иногда получают одинаковый хеш. Это коллизия.", "mod — остаток; bucket — ячейка таблицы; коллизия — одинаковый хеш разных ключей.", "h(x)=x mod 7.\n8=7×1+1 → хеш 1.\n15=7×2+1 → хеш 1.\n8 и 15 разные, но хеш совпал.", "Два человека могут иметь одинаковый номер обуви. Номер не доказывает, что это один человек.", "Какой остаток у 9 при делении на 7?", "2", "9=7+2."], ["Префикс-функция показывает, какая часть начала строки повторяется в её конце.", "Префикс — начало; суффикс — конец; собственный — не вся строка; π[i] — длина совпадения для участка 0..i.", "a: 0\nab: a≠b → 0\naba: a=a → 1\nabab: ab=ab → 2\nababa: aba=aba → 3.\nИтог: 0 0 1 2 3.", "Сравни начало и конец, начиная с самой длинной допустимой длины. Первая равная пара даёт ответ.", "Какова длина общего собственного начала и конца aba?", "1", "a совпадает с a."], ["KMP ищет все появления образца и использует уже известные совпадения, чтобы не начинать поиск заново.", "Pattern — образец; text — текст; j — число совпавших букв; π — префикс-функция; перекрытие — совпадения используют общие буквы.", "Text=ababa, pattern=aba.\nИндексы 0..2: aba → найдено.\nПосле совпадения j=π[2]=1: последняя a уже подходит для нового начала.\nЧитаем b,a → второе совпадение на индексе 2.", "Не стирай всю работу при ошибке: сохрани самый длинный подходящий кусок начала образца.", "Сколько вхождений aba в ababa?", "2", "Начала 0 и 2."], ["Период — длина блока, повторяющегося в строке, возможно с неполным последним блоком.", "n — длина строки; π[last] — последнее значение префикс-функции; период = n−π[last].", "ababab: длина 6. Начало abab совпадает с концом abab, длина 4.\n6−4=2. Блок ab повторяется 3 раза.\nЕсли нужны только полные блоки, проверь n mod период = 0.", "Найди, на сколько клеток нужно сдвинуть строку, чтобы её перекрывающиеся буквы совпали.", "У ababab длина 6 и π[last]=4. Каков период?", "2", "6−4=2."], ["Бордер — участок, который одновременно является началом и концом строки.", "Собственный бордер не равен всей строке; пустой бордер здесь не считаем.", "ababa: aba совпадает с aba, длина 3.\nВнутри aba есть бордер a, длина 1.\nЦепочка: π[4]=3 → π[2]=1 → π[0]=0.", "Ищи одинаковые кусочки на двух краях, не включая всю строку.", "Сколько непустых собственных бордеров у aba?", "1", "Только a."], ["BFS обходит граф по слоям: сначала ближайшие вершины, затем более дальние.", "Вершина — точка; ребро ая наличие прямых рёбер.", "A[u][v] — строка u, столбец v; 1 — ребро есть; 0 — нет.", "Для 0→1 и 1→2:\n  0 1 2\n0 0 1 0\n1 0 0 1\n2 0 0 0\nДля неориентированного ребра ставим 1 в обе симметричные ячейки.", "Строка отвечает на вопрос «откуда?», столбец — «куда?».", "Для ребра 1→2 чему равно A[1][2]?", "1", "Ребро существует."], ["DFS идёт по одной ветке до конца, затем возвращается и пробует следующую.", "Рекурсия — функция вызывает себя; стек — последний вошёл, первый вышел; preorder — порядок первого посещения.", "0: соседи 1,2; 1: сосед 3.\nВходим 0 → 1 → 3.\nУ 3 нет новых соседей: возвращаемся в 1, затем 0.\nИз 0 идём в 2. Порядок 0,1,3,2.", "Как исследование лабиринта: дошёл до тупика — вернулся к последней развилке.", "Из 1 пришли в 3, новых соседей нет. Куда возвращаемся?", "1", "К предыдущему вызову."], ["Топосорт располагает задачи так, чтобы зависимости выполнялись раньше зависимых задач.", "Ориентированное ребро u→v означает u раньше v; DAG — ориентированный граф без циклов; postorder — порядок завершения DFS.", "0→1→2.\nDFS входит 0,1,2.\nЗавершает 2, затем 1, затем 0.\nСписок завершения [2,1,0]. Разворачиваем: [0,1,2].", "Сначала надеть носки, потом обувь. Если задачи требуют друг друга по кругу, порядок невозможен.", "При ребре 1→2 кто должен стоять раньше?", "1", "Источник ребра."], ["Цикл — путь по направлению рёбер, возвращающийся в исходную вершину.", "Цвет 0 — не посещена; 1 — активна в рекурсии; 2 — завершена. Обратное ребро ведёт к активной вершине.", "0→1→2→0.\nВходим в 0,1,2: все имеют цвет 1.\nИз 2 видим 0 с цветом 1: цикл.\nРебро к цвету 2 само по себе цикл не доказывает.", "Цвет 1 — точки на твоём текущем маршруте. Возврат к такой точке по ребру замыкает круг.", "Какой цвет получает вершина сразу при входе DFS?", "1", "Активная вершина."], ["Мост — ребро неориентированного графа, без которого часть графа отсоединяется.", "tin[v] — номер входа DFS; low[v] — минимальный tin, достижимый из поддерева v по рёбрам дерева и не более чем одному обратному ребру.", "Треугольник 0—1—2—0 и хвост 2—3.\nDFS 0,1,2,3: tin=0,1,2,3.\nИз 2 есть обратное ребро в 0: low[2]=0.\nУ 3 нет обходного пути: low[3]=3.\n3>tin[2]=2, значит 2—3 мост.\nlow[2]=0 не больше tin[1]=1, значит 1—2 не мост.", "Если закрыть дорогу и существует объезд, это не мост. Если объезда нет — мост.", "Сколько мостов у треугольника?", "0", "У каждого ребра есть обход через третью вершину."], ["Сложность описывает, как растёт объём работы алгоритма при увеличении графа.", "V — число вершин; E — число рёбер; O(...) — порядок роста; список смежности хранит соседей.", "Для 5 вершин и 4 рёбер BFS/DFS со списком смежности посещают вершины и просматривают рёбра: O(V+E).\nМатрица требует проверки до V² ячеек.\nBFS использует очередь, DFS — стек.", "Список соседей — адресная книга только нужных контактов; матрица — проверка всех возможных пар.", "Какой обход использует стек? (BFS/DFS)", "DFS", "DFS идёт в глубину."]];
